services:
  # nginx is reuse among several application
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-6432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared

  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASS}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: flytwo:latest
    env_file: .env
    environment:
      DB_HOST: flytwo_postgres_1
      DB_PORT: 5432
      REDIS_HOST: flytwo_redis_1
      REDIS_PORT: 6379
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shared

  mcp:
    image: flytwo:latest
    command: ["python", "-m", "mcp_server"]
    env_file: .env
    environment:
      MCP_API_BASE: http://bot:8080
    expose:
      - "8765"
    depends_on:
      - bot
    networks:
      - shared


volumes:
  postgres_data:

networks:
  shared:
    external: true
